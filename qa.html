<!doctype html><html><head><meta charset="utf-8"><title>My Doctor checks</title></head><body><pre id="results">RUNNING</pre><iframe id="test" src="index.html" style="width:390px;height:844px"></iframe><script>
const output=document.querySelector('#results'), frame=document.querySelector('#test');
frame.onload=async()=>{const w=frame.contentWindow,d=w.document,results=[];const run=s=>w.eval(s);run("state=seed();save();role='';go('launcher')");const check=(v,s)=>{if(!v)throw Error(s);results.push('PASS '+s)};const click=s=>{const e=d.querySelector(s);if(!e)throw Error('Missing '+s);e.click()};const submit=s=>d.querySelector(s).requestSubmit();try{
check(d.body.textContent.includes('Good health'),'Launcher renders');
click('[data-role="patient"]');submit('#auth-form');d.querySelector('[name=otp]').value='1234';submit('#auth-form');check(d.body.textContent.includes('Hello, Aarav'),'Patient OTP sign-in');
click('[data-screen="doctors"]');check(d.querySelectorAll('.doctor').length===8,'Eight doctor profiles');
const input=d.querySelector('#doctor-search');input.value='Cardiologist';input.dispatchEvent(new w.Event('input',{bubbles:true}));check(d.querySelectorAll('.doctor').length===1,'Doctor search');
run("search='';filter='All';render();showDoctor('d0');");click('[data-action="book"]');const date=d.querySelector('[name=date]');date.value=run('day(1)');date.dispatchEvent(new w.Event('change',{bubbles:true}));submit('#booking-form');click('[data-action=payment]');submit('#payment-form');await new Promise(r=>setTimeout(r,1300));check(run('state.appointments.length')===4,'Payment creates appointment');check(d.querySelector('dialog').textContent.includes('confirmed'),'Confirmation displayed');
run("modal.close();role='doctor';doctorId='d0';doctorDay=day(1);go('home');");check(d.body.textContent.includes('Aarav'),'Booking visible to doctor');run("consult(state.appointments.at(-1).id)");click('[data-action=prescribe]');for(const [n,v] of Object.entries({medicine:'Demo test medicine',dosage:'1 tablet',frequency:'Once daily',duration:'2 days',instructions:'Fictional'}))d.querySelector('[name='+n+']').value=v;submit('#prescription-form');check(run('state.prescriptions.length')===2,'Doctor prescription saved');check(run("state.records.some(r=>r.rx===state.prescriptions.at(-1).id)"),'Prescription creates medical record');
run("role='patient';go('prescriptions')");check(d.body.textContent.includes('Ananya'),'Prescription visible to patient');run("go('queue')");const old=run('queueStatus(state.appointments[0]).current');click('[data-action=advance-queue]');check(run('queueStatus(state.appointments[0]).current')===old+1,'Queue state advances');
run("role='admin';adminTab='Payments';go('home');window.confirm=()=>true");click('[data-action=refund]');check(run("state.appointments[0].payment==='Refund Pending'"),'Refund requested');click('[data-action=process-refund]');check(run("state.appointments[0].payment==='Refunded'&&state.appointments[0].status==='Cancelled'"),'Refund processed');
run("adminTab='Commission';render()");d.querySelector('[name=percent]').value=15;submit('#commission-form');check(run('state.commission')===15,'Commission calculation state');
run("doctor('d7').status='Pending';adminTab='KYC Verification';render()");run("document.querySelector('[data-action=kyc][data-id=d7]').click()");click('[data-action=kyc-approve]');check(run("doctor('d7').status==='Approved'"),'KYC approval synchronizes');
for(const tab of run('adminTabs')){run('adminTab='+JSON.stringify(tab)+';render()');check(d.querySelector('.admin-content')!==null,'Admin '+tab);}
run("role='patient';modal.close();go('home')");for(const width of [320,360,375,390,414,430,768,1280]){frame.style.width=width+'px';await new Promise(r=>setTimeout(r,20));check(d.documentElement.scrollWidth<=width,'No home overflow at '+width+'px');}
check(JSON.parse(w.localStorage.getItem('my-doctor-mvp-v1')).commission===15,'Local storage persisted');
run("state=seed();save();role='';go('launcher')");output.textContent=results.join('\n')+'\nALL CHECKS PASSED';
}catch(e){output.textContent=results.join('\n')+'\nFAIL '+e.stack;}};
</script></body></html>
