<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Doctor browser checks</title>
  <style>
    body { margin: 20px; font: 14px/1.5 monospace; color: #18334a; background: #f4f9fc; }
    #results { white-space: pre-wrap; overflow-wrap: anywhere; }
    #test { display: block; width: 390px; height: 568px; border: 1px solid #c9dce6; background: white; }
  </style>
</head>
<body>
  <pre id="results" role="status">RUNNING — connected workflows and responsive checks</pre>
  <iframe id="test" title="My Doctor browser test workspace"></iframe>
  <script>
    'use strict';
    const output = document.querySelector('#results');
    const frame = document.querySelector('#test');
    const storageKey = 'my-doctor-mvp-v1';
    const results = [];
    const runtimeErrors = [];
    const widths = [320, 360, 375, 390, 414, 430, 768, 1280];
    const snapshotStorage = storage => Array.from({ length: storage.length }, (_, index) => {
      const key = storage.key(index);
      return [key, storage.getItem(key)];
    });
    // Capture data before index.html bootstraps. The marker identifies browsers
    // that share a local-file storage area between the QA page and application.
    const originalStorage = snapshotStorage(localStorage);
    const storageMarker = 'my-doctor-qa-' + Date.now() + '-' + Math.random().toString(36).slice(2);
    localStorage.setItem(storageMarker, 'storage-probe');
    let finished = false;

    frame.onload = async () => {
      if (finished || frame.contentWindow.location.href === 'about:blank') return;
      const w = frame.contentWindow;
      const d = w.document;
      const sharedStorage = w.localStorage.getItem(storageMarker) === 'storage-probe';
      const baseline = sharedStorage ? originalStorage : snapshotStorage(w.localStorage);
      localStorage.removeItem(storageMarker);
      const originalEntry = baseline.find(([key]) => key === storageKey);
      const run = source => w.eval(source);
      const pause = () => new Promise(resolve => setTimeout(resolve, 20));
      const visible = element => element.getClientRects().length > 0 &&
        w.getComputedStyle(element).visibility !== 'hidden';
      const describe = element => element.id ? '#' + element.id :
        element.tagName.toLowerCase() + (element.className && typeof element.className === 'string'
          ? '.' + element.className.trim().replace(/\s+/g, '.') : '');
      const check = (condition, label) => {
        if (runtimeErrors.length) throw new Error('JavaScript runtime error: ' + runtimeErrors.join(' | '));
        if (!condition) throw new Error(label);
        results.push('PASS ' + label);
      };
      const click = selector => {
        const element = d.querySelector(selector);
        if (!element) throw new Error('Missing ' + selector);
        element.click();
      };
      const submit = selector => {
        const form = d.querySelector(selector);
        if (!form) throw new Error('Missing form ' + selector);
        if (!form.checkValidity()) throw new Error('Invalid test form ' + selector);
        form.requestSubmit();
      };
      const fill = (selector, values) => {
        const form = d.querySelector(selector);
        if (!form) throw new Error('Missing form ' + selector);
        for (const [name, value] of Object.entries(values)) {
          const input = form.elements.namedItem(name);
          if (!input) throw new Error('Missing form field ' + name);
          input.value = value;
        }
      };
      const waitFor = async condition => {
        const deadline = Date.now() + 2500;
        while (!condition() && Date.now() < deadline) await pause();
      };
      const checkImages = async (selector, label) => {
        const images = Array.from(d.querySelectorAll(selector));
        check(images.length > 0, label + ': images are present');
        check(images.every(image => /^assets\//.test(image.getAttribute('src')) &&
          /\.(?:avif|jpe?g|png|webp)(?:$|[?#])/i.test(image.getAttribute('src'))),
          label + ': photographs use bundled image files');
        // Eager loading here also checks assets belonging to cards below the
        // small test viewport. Production loading behavior stays unchanged.
        images.forEach(image => { image.loading = 'eager'; });
        await Promise.all(images.map(image => image.complete ? Promise.resolve() :
          new Promise(resolve => {
            image.addEventListener('load', resolve, { once: true });
            image.addEventListener('error', resolve, { once: true });
            setTimeout(resolve, 5000);
          })));
        check(images.every(image => image.complete && image.naturalWidth > 0),
          label + ': all photographs load successfully');
      };
      const resize = async width => {
        frame.style.width = width + 'px';
        frame.style.height = (width <= 430 ? 568 : width === 768 ? 740 : 800) + 'px';
        await pause();
      };
      const layout = label => {
        const viewportWidth = d.documentElement.clientWidth;
        const overflow = Math.max(d.documentElement.scrollWidth, d.body.scrollWidth) - viewportWidth;
        const offenders = () => Array.from(d.querySelectorAll('body *')).filter(visible)
          .filter(element => element.getBoundingClientRect().right > viewportWidth + 1)
          .slice(0, 5).map(describe).join(', ');
        check(overflow <= 1, label + ': no page overflow' +
          (overflow > 1 ? ' (' + Math.ceil(overflow) + 'px: ' + offenders() + ')' : ''));
        if (w.innerWidth <= 700) {
          const controls = Array.from(d.querySelectorAll(
            'input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]), select, textarea'
          )).filter(visible);
          const smallControls = controls.filter(element => parseFloat(w.getComputedStyle(element).fontSize) < 16);
          check(!smallControls.length, label + ': readable form text (16px minimum)' +
            (smallControls.length ? ' — ' + smallControls.map(describe).join(', ') : ''));
          const targets = Array.from(d.querySelectorAll(
            'header button, nav[aria-label="Main navigation"] button, .mobile-menu, .sidebar.open button'
          )).filter(visible);
          const smallTargets = targets.filter(element => {
            const rect = element.getBoundingClientRect();
            return rect.width < 43.5 || rect.height < 43.5;
          });
          check(!smallTargets.length, label + ': navigation targets at least 44px' +
            (smallTargets.length ? ' — ' + smallTargets.map(element => {
              const rect = element.getBoundingClientRect();
              return describe(element) + ' ' + rect.width.toFixed(1) + '×' + rect.height.toFixed(1);
            }).join(', ') : ''));
        }
        const navigation = d.querySelector('nav[aria-label="Main navigation"]');
        if (navigation && visible(navigation)) {
          const rect = navigation.getBoundingClientRect();
          check(rect.left >= -1 && rect.right <= w.innerWidth + 1 && rect.bottom <= w.innerHeight + 1,
            label + ': bottom navigation fits viewport');
        }
        if (d.body.dataset.role === 'patient') {
          const copy = Array.from(d.querySelectorAll('main, main *')).filter(visible)
            .filter(element => Array.from(element.childNodes).some(node =>
              node.nodeType === w.Node.TEXT_NODE && node.textContent.trim()));
          const smallCopy = copy.filter(element => parseFloat(w.getComputedStyle(element).fontSize) < 12);
          check(!smallCopy.length, label + ': patient text is at least 12px' +
            (smallCopy.length ? ' (' + smallCopy.slice(0, 5).map(describe).join(', ') + ')' : ''));
          if (navigation && visible(navigation)) {
            check(Array.from(navigation.querySelectorAll('button')).every(button =>
              parseFloat(w.getComputedStyle(button).fontSize) >= 11),
              label + ': bottom navigation labels are at least 11px');
            check(navigation.querySelectorAll('button .nav-icon svg path[d]').length === 5,
              label + ': all five navigation icons are drawn');
          }
        }
      };
      const modalLayout = label => {
        const modal = d.querySelector('dialog[open]');
        check(Boolean(modal), label + ': dialog opens');
        const rect = modal.getBoundingClientRect();
        check(rect.left >= -1 && rect.top >= -1 && rect.right <= w.innerWidth + 1 && rect.bottom <= w.innerHeight + 1,
          label + ': dialog fits ' + w.innerWidth + '×' + w.innerHeight);
        check(modal.scrollWidth <= modal.clientWidth + 1, label + ': dialog content has no horizontal overflow');
        const close = modal.querySelector('[data-action="close"]');
        if (close && w.innerWidth <= 700) {
          const closeRect = close.getBoundingClientRect();
          check(closeRect.width >= 43.5 && closeRect.height >= 43.5, label + ': close target at least 44px');
        }
        layout(label);
      };
      const closeModal = () => run("if(modal.open)modal.close()");
      const onError = event => runtimeErrors.push(event.message || 'Uncaught application error');
      const onRejection = event => runtimeErrors.push(String(event.reason?.stack || event.reason || 'Unhandled rejection'));
      w.addEventListener('error', onError);
      w.addEventListener('unhandledrejection', onRejection);
      const restoreStorage = () => {
        // Only this key changes in the app. Preserve unrelated data and updates
        // made by another tab; never clear localStorage.
        if (originalEntry) w.localStorage.setItem(storageKey, originalEntry[1]);
        else w.localStorage.removeItem(storageKey);
        localStorage.removeItem(storageMarker);
      };
      window.addEventListener('pagehide', restoreStorage, { once: true });
      let failure = null;
      try {
        check(run("typeof seed==='function'&&typeof render==='function'"), 'Application JavaScript initializes');
        run("state=seed();save();role='';go('launcher')");
        check(d.body.textContent.includes('Good health'), 'Launcher renders');
        click('[data-role="patient"]');
        submit('#auth-form');
        d.querySelector('[name="otp"]').value = '1234';
        submit('#auth-form');
        check(d.body.textContent.includes('Hello, Aarav'), 'Patient OTP sign-in');
        await resize(390);
        const bannerTitle = () => d.querySelector('.care-banner h1, .care-banner h2').textContent;
        const firstBannerTitle = bannerTitle();
        await checkImages('.care-banner img', 'Home care banner');
        const bannerImageRect = d.querySelector('.care-banner img').getBoundingClientRect();
        const bannerViewportRect = d.querySelector('.banner-viewport').getBoundingClientRect();
        check(bannerImageRect.width > 0 && bannerImageRect.height > 0 &&
          bannerImageRect.top <= bannerViewportRect.top + 1 &&
          bannerImageRect.bottom >= bannerViewportRect.bottom - 1 &&
          bannerImageRect.right >= bannerViewportRect.right - 1,
          'Banner photograph fills the visible banner area');
        const headerBeforeBannerChange = d.querySelector('.app-header');
        const bannerDots = d.querySelectorAll('.banner-dots [data-action="banner-slide"]');
        check(bannerDots.length >= 3, 'Home banner provides at least three selectable care messages');
        const selectedBannerDot = index => {
          const dot = d.querySelector('.banner-dots [data-index="' + index + '"]');
          return dot && ['aria-current', 'aria-pressed', 'aria-selected']
            .some(attribute => dot.getAttribute(attribute) === 'true');
        };
        click('.care-banner [data-action="banner-next"]');
        check(bannerTitle() !== firstBannerTitle && selectedBannerDot(1),
          'Next banner changes its message and announces the selected slide');
        click('.care-banner [data-action="banner-prev"]');
        check(bannerTitle() === firstBannerTitle && selectedBannerDot(0),
          'Previous banner returns to the first care message');
        click('.banner-dots [data-index="2"]');
        check(bannerTitle() !== firstBannerTitle && selectedBannerDot(2),
          'Banner dots select a care message');
        check(d.querySelector('.app-header') === headerBeforeBannerChange,
          'Changing a banner keeps the surrounding page in place');
        layout('Interactive home banner, 390px');
        click('.banner-dots [data-index="0"]');
        click('.care-banner [data-action="navigate"]');
        check(run('screen') === 'doctors', 'Book appointment banner opens Find doctors');
        run("go('home')");
        click('.banner-dots [data-index="1"]');
        click('.care-banner [data-action="navigate"]');
        check(run('screen') === 'family', 'Family care banner opens Family members');
        run("go('home')");
        click('.banner-dots [data-index="2"]');
        click('.care-banner [data-action="navigate"]');
        check(run('screen') === 'records', 'Health records banner opens Medical records');
        run("go('home')");
        click('.banner-dots [data-index="0"]');
        click('[data-screen="doctors"]');
        check(d.querySelectorAll('.doctor').length === 8, 'Eight doctor profiles');
        await checkImages('.doctor .doctor-avatar img', 'Find doctors profile portraits');
        check(new Set(Array.from(d.querySelectorAll('.doctor .doctor-avatar img'), image => image.getAttribute('src'))).size === 8,
          'Each demo doctor has an individual profile portrait');
        await resize(390);
        const specialityRail = d.querySelector('.speciality-rail');
        specialityRail.scrollLeft = specialityRail.scrollWidth;
        const railOffset = specialityRail.scrollLeft;
        click('[data-action="speciality"][data-value="ENT"]');
        check(railOffset > 0 && Math.abs(d.querySelector('.speciality-rail').scrollLeft - railOffset) < 1 &&
          d.querySelector('[data-value="ENT"]').getAttribute('aria-pressed') === 'true' &&
          d.querySelectorAll('.doctor').length === 1 && d.querySelector('.doctor').textContent.includes('Sana Khan'),
          'Mobile ENT filter preserves speciality rail scroll and shows the matching doctor');
        click('[data-action="speciality"][data-value="All"]');
        const searchInput = d.querySelector('#doctor-search');
        searchInput.value = 'Cardiologist';
        searchInput.dispatchEvent(new w.Event('input', { bubbles: true }));
        check(d.querySelectorAll('.doctor').length === 1, 'Doctor search');
        run("search='';filter='All';render();showDoctor('d0')");
        run("toast('Demo error')");
        const dialogFeedback = d.querySelector('dialog[open] #dialog-feedback');
        check(dialogFeedback && visible(dialogFeedback) && dialogFeedback.textContent === 'Demo error' &&
          dialogFeedback.getBoundingClientRect().bottom <= dialogFeedback.closest('dialog').getBoundingClientRect().bottom,
          'Modal feedback is visible inside the open dialog');
        modalLayout('Doctor profile, 390px');
        click('[data-action="book"]');
        // Tomorrow may be Sunday or fully booked. Find a working day with slots.
        const bookingDate = run("Array.from({length:14},(_,i)=>day(i+1)).find(date=>slots(doctor('d0'),date).length)");
        check(Boolean(bookingDate), 'A future working day has available slots');
        const dateInput = d.querySelector('#booking-form [name="date"]');
        dateInput.value = bookingDate;
        dateInput.dispatchEvent(new w.Event('change', { bubbles: true }));
        modalLayout('Booking form, 390px');
        submit('#booking-form');
        modalLayout('Booking review, 390px');
        click('[data-action="payment"]');
        modalLayout('Payment form, 390px');
        submit('#payment-form');
        await new Promise(resolve => setTimeout(resolve, 1300));
        check(run('state.appointments.length') === 4, 'Payment creates appointment');
        check(d.querySelector('dialog').textContent.includes('confirmed'), 'Confirmation displayed');
        modalLayout('Booking confirmation, 390px');
        run("modal.close();role='doctor';doctorId='d0';doctorDay=" + JSON.stringify(bookingDate) + ";go('home')");
        check(d.body.textContent.includes('Aarav'), 'Booking visible to doctor');
        const statTops = Array.from(d.querySelectorAll('.screen-home > .page-heading + .grid > .card'))
          .map(card => card.getBoundingClientRect().top);
        check(statTops.length === 3 && Math.max(...statTops) - Math.min(...statTops) < 1,
          'Doctor mobile statistics stay together on one row');
        run('consult(state.appointments.at(-1).id)');
        modalLayout('Doctor consultation, 390px');
        click('[data-action="prescribe"]');
        modalLayout('Prescription form, 390px');
        for (const [name, value] of Object.entries({
          medicine: 'Demo test medicine', dosage: '1 tablet', frequency: 'Once daily',
          duration: '2 days', instructions: 'Fictional'
        })) d.querySelector('[name="' + name + '"]').value = value;
        submit('#prescription-form');
        check(run('state.prescriptions.length') === 2, 'Doctor prescription saved');
        check(run('state.records.some(record=>record.rx===state.prescriptions.at(-1).id)'), 'Prescription creates medical record');
        run("role='patient';go('prescriptions')");
        check(d.body.textContent.includes('Ananya'), 'Prescription visible to patient');
        run("queueAppointment=state.appointments[0].id;go('queue')");
        const oldToken = run('queueStatus(state.appointments[0]).current');
        click('[data-action="advance-queue"]');
        check(run('queueStatus(state.appointments[0]).current') === oldToken + 1, 'Queue state advances');
        run("role='admin';adminTab='Payments';go('home');window.confirm=()=>true");
        click('[data-action="refund"]');
        check(run("state.appointments[0].payment==='Refund Pending'"), 'Refund requested');
        click('[data-action="process-refund"]');
        check(run("state.appointments[0].payment==='Refunded'&&state.appointments[0].status==='Cancelled'"), 'Refund processed');
        run("adminTab='Commission';render()");
        d.querySelector('[name="percent"]').value = 15;
        submit('#commission-form');
        check(run('state.commission') === 15, 'Commission calculation state');
        run("doctor('d7').status='Pending';adminTab='KYC Verification';render()");
        click('[data-action="kyc"][data-id="d7"]');
        modalLayout('KYC review, 390px');
        click('[data-action="kyc-approve"]');
        check(run("doctor('d7').status==='Approved'"), 'KYC approval synchronizes');
        check(JSON.parse(w.localStorage.getItem(storageKey)).commission === 15, 'Local storage persists workflow changes');

        run("adminTab='Doctors';adminSearch='';render()");
        const adminSections = run('adminTabs');
        check(adminSections.length === 12 && !adminSections.includes('Hospital Management') &&
          !adminSections.includes('Pharmacy Management') &&
          !d.querySelector('.sidebar').textContent.includes('Hospital Management') &&
          !d.querySelector('.sidebar').textContent.includes('Pharmacy Management'),
          'Admin navigation contains twelve sections without hospital or pharmacy management');
        click('[data-action="admin-doctor-add"]');
        modalLayout('Add doctor form, 390px');
        fill('#admin-doctor-form', {
          name: 'Dr. QA Care', mobile: '9000000099', qualification: 'MBBS, MD',
          experience: 7, registration: 'QA-MCI-12345', speciality: 'General Physician',
          fee: 725, clinic: 'QA Community Care', city: 'Pune', languages: 'English, Hindi',
          bio: 'Fictional clinician created by the browser workflow check.',
          status: 'Approved', accountStatus: 'Active', start: '09:00', end: '17:00', duration: 30
        });
        submit('#admin-doctor-form');
        await pause();
        const createdDoctorId = run("state.doctors.find(doctor=>doctor.name==='Dr. QA Care')?.id");
        check(Boolean(createdDoctorId) && run('doctor(' + JSON.stringify(createdDoctorId) + ').fee') === 725,
          'Admin adds a doctor with numeric consultation charges');
        click('[data-action="admin-doctor-details"][data-id="' + createdDoctorId + '"]');
        modalLayout('Admin doctor details, 390px');
        const doctorDetails = d.querySelector('dialog[open]').textContent;
        check(['Dr. QA Care', 'QA-MCI-12345', 'QA Community Care', 'Pune', 'English', 'Hindi',
          run('money(725)'), '09:00', '17:00'].every(value => doctorDetails.includes(value)),
          'Manage doctors details show charges, registration, clinic, languages and availability');
        closeModal();
        click('[data-action="admin-doctor-edit"][data-id="' + createdDoctorId + '"]');
        fill('#admin-doctor-form', { fee: 875 });
        // A generated PNG fixture exercises the native file input, image
        // validation and persistence without reading personal files.
        const photoCanvas = d.createElement('canvas');
        photoCanvas.width = photoCanvas.height = 32;
        const photoContext = photoCanvas.getContext('2d');
        photoContext.fillStyle = '#d4f3eb';
        photoContext.fillRect(0, 0, 32, 32);
        const photoBytes = w.Uint8Array.from(w.atob(photoCanvas.toDataURL('image/png').split(',')[1]), character => character.charCodeAt(0));
        const photoTransfer = new w.DataTransfer();
        photoTransfer.items.add(new w.File([photoBytes], 'qa-profile.png', { type: 'image/png' }));
        const photoInput = d.querySelector('#admin-doctor-form [name="photo"]');
        photoInput.files = photoTransfer.files;
        photoInput.dispatchEvent(new w.Event('change', { bubbles: true }));
        submit('#admin-doctor-form');
        await waitFor(() => !d.querySelector('#admin-doctor-form'));
        check(JSON.parse(w.localStorage.getItem(storageKey)).doctors.find(doctor => doctor.id === createdDoctorId).fee === 875,
          'Edited doctor consultation charges persist in local storage');
        const savedDoctor = JSON.parse(w.localStorage.getItem(storageKey)).doctors.find(doctor => doctor.id === createdDoctorId);
        check(savedDoctor.photo.startsWith('data:image/png;base64,') && savedDoctor.photoFilename === 'qa-profile.png',
          'Admin profile photograph upload is validated and persisted');
        click('[data-action="admin-doctor-edit"][data-id="' + createdDoctorId + '"]');
        check(d.querySelector('#admin-doctor-form [name="fee"]').value === '875' &&
          d.querySelector('#admin-doctor-form [name="clinic"]').value === 'QA Community Care',
          'Reopening the doctor editor retains charges and professional details');
        closeModal();

        const historicalFees = run('JSON.stringify(state.appointments.map(appointment=>[appointment.id,appointment.fee]))');
        click('[data-action="admin-doctor-edit"][data-id="d0"]');
        fill('#admin-doctor-form', { fee: 845, clinic: 'My Doctor Care Clinic', city: 'Pune' });
        submit('#admin-doctor-form');
        await pause();
        check(run('doctor("d0").fee') === 845 &&
          run('JSON.stringify(state.appointments.map(appointment=>[appointment.id,appointment.fee]))') === historicalFees,
          'Updating consultation charges preserves the fees of historical appointments');
        run("role='patient';search='';filter='All';go('doctors')");
        const createdDoctorImage = d.querySelector('[data-action="doctor-profile"][data-id="' + createdDoctorId + '"]')
          .closest('.doctor').querySelector('.doctor-avatar img');
        check(createdDoctorImage.getAttribute('src') === savedDoctor.photo,
          'The patient doctor list uses the profile photograph uploaded by the admin');
        const editedDoctorCard = d.querySelector('[data-action="doctor-profile"][data-id="d0"]').closest('.doctor');
        check(editedDoctorCard.textContent.includes(run('money(845)')),
          'Patient doctor list shows the charge set by the admin');
        click('[data-action="doctor-profile"][data-id="d0"]');
        check(d.querySelector('dialog[open]').textContent.includes(run('money(845)')),
          'Doctor profile shows the admin consultation charge');
        click('[data-action="book"]');
        const updatedBookingDate = run("Array.from({length:14},(_,i)=>day(i+1)).find(date=>slots(doctor('d0'),date).length)");
        const updatedDateInput = d.querySelector('#booking-form [name="date"]');
        updatedDateInput.value = updatedBookingDate;
        updatedDateInput.dispatchEvent(new w.Event('change', { bubbles: true }));
        submit('#booking-form');
        check(d.querySelector('dialog[open]').textContent.includes(run('money(845)')),
          'Appointment review uses the admin consultation charge');
        click('[data-action="payment"]');
        check(d.querySelector('#payment-form button[type="submit"]').textContent.includes(run('money(845)')),
          'Checkout charges the fee configured by the admin');
        const appointmentsBeforeUpdatedPayment = run('state.appointments.length');
        submit('#payment-form');
        await new Promise(resolve => setTimeout(resolve, 1300));
        check(run('state.appointments.length') === appointmentsBeforeUpdatedPayment + 1 &&
          run('state.appointments.at(-1).fee') === 845,
          'Newly paid appointment stores the updated consultation charge');
        check(run('JSON.stringify(state.appointments.slice(0,-1).map(appointment=>[appointment.id,appointment.fee]))') === historicalFees,
          'Completing a new booking leaves historical payment amounts unchanged');
        closeModal();

        // Start the layout matrix with populated fixtures, independent of the
        // booking, cancellation and commission mutations above.
        run("state=seed();save();selectedPatient='self';doctorId='d0';doctorDay=day();queueAppointment='';");
        const views = [
          ['Launcher', "role='';go('launcher')"],
          ['Patient sign-in', "role='patient';authRole='patient';go('auth')"],
          ['Patient OTP', "role='patient';authRole='patient';authMobile='9000000001';go('otp')"],
          ...['home', 'doctors', 'appointments', 'records', 'prescriptions', 'family', 'profile', 'queue', 'notifications']
            .map(screen => ['Patient ' + screen, "role='patient';appointmentTab='Today';go(" + JSON.stringify(screen) + ')']),
          ['Patient upcoming appointments', "role='patient';appointmentTab='Upcoming';go('appointments')"],
          ['Patient completed appointments', "role='patient';appointmentTab='Completed';go('appointments')"],
          ...['home', 'schedule', 'queue', 'profile', 'notifications']
            .map(screen => ['Doctor ' + screen, "role='doctor';go(" + JSON.stringify(screen) + ')']),
          ...run('adminTabs').map(tab => ['Admin ' + tab,
            "role='admin';adminTab=" + JSON.stringify(tab) + ";adminSearch='';adminDate='';adminStatus='';adminDoctor='';go('home')"])
        ];
        for (const width of widths) {
          await resize(width);
          for (const [name, source] of views) {
            closeModal();
            run(source);
            await pause();
            check(Boolean(d.querySelector('main')), name + ' renders at ' + width + 'px');
            layout(name + ', ' + width + 'px');
            if (name === 'Admin Dashboard') {
              const menu = d.querySelector('.mobile-menu');
              if (menu && visible(menu)) {
                click('[data-action="admin-menu"]');
                await pause();
                check(d.querySelectorAll('.sidebar.open button').length === run('adminTabs.length'),
                  'All admin sections reachable at ' + width + 'px');
                layout('Expanded admin navigation, ' + width + 'px');
              }
            }
          }
          results.push('PASS COMPLETE SCREEN MATRIX AT ' + width + 'px');
          output.textContent = results.join('\n') + '\nRUNNING — remaining widths and dialogs';
        }

        const modalViews = [
          ['Doctor profile', "role='patient';go('doctors');showDoctor('d0')"],
          ['Booking form', "role='patient';go('doctors');booking={doctor:'d0',patient:'self',date:" +
            JSON.stringify(bookingDate) + ",time:'09:00',type:'Offline',step:1};bookingView()"],
          ['Booking review', 'booking.step=2;bookingView()'],
          ['Payment form', 'booking.step=3;bookingView()'],
          ['Appointment details', "role='patient';go('appointments');detail(state.appointments[0].id)"],
          ['Medical document', "role='patient';go('records');showRecord('r1')"],
          ['Patient prescription', "role='patient';go('prescriptions');showRx('rx1')"],
          ['Family member form', "role='patient';go('family');familyEdit('f1')"],
          ['Patient profile form', "role='patient';go('profile');document.querySelector('[data-action=edit-profile]').click()"],
          ['Doctor consultation', "role='doctor';go('home');consult(state.appointments[0].id)"],
          ['Medical history', "role='doctor';history('self')"],
          ['Prescription editor', "role='doctor';prescribe(state.appointments[0].id)"],
          ['KYC review', "role='admin';adminTab='KYC Verification';go('home');document.querySelector('[data-action=kyc][data-id=d0]').click()"],
          ['Admin doctor details', "role='admin';adminTab='Doctors';go('home');document.querySelector('[data-action=admin-doctor-details][data-id=d0]').click()"],
          ['Admin doctor editor', "role='admin';adminTab='Doctors';go('home');document.querySelector('[data-action=admin-doctor-edit][data-id=d0]').click()"],
          ['Admin add doctor', "role='admin';adminTab='Doctors';go('home');document.querySelector('[data-action=admin-doctor-add]').click()"],
          ['Support request', "role='admin';adminTab='Complaints / Support';go('home');document.querySelector('[data-action=complaint]').click()"]
        ];
        for (const width of [320, 390, 768]) {
          await resize(width);
          for (const [name, source] of modalViews) {
            closeModal();
            run(source);
            await pause();
            modalLayout(name + ', ' + width + 'px');
          }
        }
        check(runtimeErrors.length === 0, 'No uncaught JavaScript errors or rejected promises');
      } catch (error) {
        failure = error;
      } finally {
        finished = true;
        try {
          closeModal();
        } catch (error) {
          if (!failure) failure = error;
        }
        restoreStorage();
        w.removeEventListener('error', onError);
        w.removeEventListener('unhandledrejection', onRejection);
        window.removeEventListener('pagehide', restoreStorage);
        const restored = w.localStorage.getItem(storageKey) === (originalEntry ? originalEntry[1] : null);
        results.push((restored ? 'PASS ' : 'FAIL ') + 'Original local data restored');
        if (!restored && !failure) failure = new Error('Original local data could not be restored');
        // Remove the fixture app to prevent later clicks saving test data over
        // the restored user data.
        frame.remove();
        output.textContent = results.join('\n') + (failure ? '\nFAIL ' + failure.stack : '\nALL CHECKS PASSED');
        document.documentElement.dataset.qaStatus = failure ? 'failed' : 'passed';
      }
    };
    frame.src = 'index.html';
  </script>
</body>
